name: Build Orvim
on:
  push:
    branches: [main, feature/visual-foundation, "codex/**"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "tests/**"
      - "scripts/**"
      - "!scripts/verify-site.mjs"
      - "!scripts/verify-doc-links.mjs"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  ORVIM_UPDATE_PUBLIC_KEY: ${{ vars.ORVIM_UPDATE_PUBLIC_KEY || vars.LIFE_OS_UPDATE_PUBLIC_KEY }}
  ORVIM_UPDATE_MANIFEST_URL: ${{ vars.ORVIM_UPDATE_MANIFEST_URL || vars.LIFE_OS_UPDATE_MANIFEST_URL }}
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run test:ui
      - run: npm run rust:test
      - run: npm run rust:fmt
      - run: npm run rust:lint
      - run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Orvim-Windows
          path: |
            src-tauri/target/release/orvim.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;35.0.0' 'ndk;30.0.16248370'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: |
          export NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          toolchain="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$toolchain/clang"
          export CFLAGS_aarch64_linux_android="--target=aarch64-linux-android24"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          export RANLIB_aarch64_linux_android="$toolchain/llvm-ranlib"
          npm run android:build -- --apk --target aarch64 --ci
      - name: Audit Android runtime notices
        run: |
          src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:dependencies --configuration universalReleaseRuntimeClasspath > android-runtime-dependencies.txt
          node scripts/check-android-runtime-notices.mjs android-runtime-dependencies.txt
      - name: Sign release APK when configured
        shell: bash
        env:
          RELEASE_KEYSTORE: ${{ secrets.ORVIM_ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ORVIM_ANDROID_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ORVIM_ANDROID_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ORVIM_ANDROID_KEY_ALIAS }}
        run: |
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          mkdir -p artifacts
          if [ -n "$RELEASE_KEYSTORE" ]; then
            printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/orvim.jks"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 "$apk" artifacts/Orvim.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/orvim.jks" --ks-key-alias "$RELEASE_KEY_ALIAS" --ks-pass env:RELEASE_STORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD artifacts/Orvim.apk
            certificate=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/Orvim.apk)
            [[ "$certificate" == *"certificate SHA-256 digest: 69769e705d33225d37d62da35c3d549c219d6235cf658118a16649056591c386"* ]]
            printf '%s\n' "$certificate"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 artifacts/Orvim.apk
          else
            cp "$apk" artifacts/Orvim-unsigned.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Orvim-Android
          path: artifacts/*.apk
          if-no-files-found: error
