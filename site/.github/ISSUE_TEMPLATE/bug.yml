name: Сообщить об ошибке
description: Помогите воспроизвести проблему в Orvim.
title: "Ошибка: "
body:
  - type: markdown
    attributes:
      value: "Сообщение публичное. Не прикладывайте личную базу, ключи или скриншоты с персональными данными."
  - type: input
    id: version
    attributes:
      label: Версия Orvim и устройство
      placeholder: Например, 0.4.23, Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить?
      description: Действия, ожидаемый результат и что получилось на деле.
    validations:
      required: true
