[package]
name = "orvim"
version = "0.4.47"
license = "Apache-2.0"
description = "Orvim application foundation"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orvim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.5.3"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
sha2 = "0.10"
ed25519-dalek = "2.2"
semver = "1"
base64 = "0.22"
chacha20poly1305 = "0.10.1"
spake2 = "0.4.0"
if-addrs = "0.13"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
tauri-plugin-opener = "2"

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
